<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/style.css">
    <title>Homework lesson 4 - Tracker</title>
</head>
<body>
    <header>
        <nav class="nav-wrap">
            <ul class="nav justify-content-center">
                <li class="nav-item"><a href="index.html" class="nav-link active" aria-current="page">Home</a></li>
                <li class="nav-item"><a href="#" target="_blank" class="nav-link " >News</a></li>
                <li class="nav-item"><a href="#" target="_blank" class="nav-link " >Contact</a></li>
                <li class="nav-item"><a href="#" target="_blank" class="nav-link " >Services</a></li>
                <li class="nav-item"><a href="#" target="_blank" class="nav-link " >Registration</a></li>
                <li class="nav-item"><a href="#" target="_blank" class="nav-link " >Homework</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="wrap card card-body p-5">
            <h1 class="title center">Homework tracker</h1>
            <form class="d-flex justify-content-center align-items-center mb-4">
                <div data-mdb-input-init class="form-outline flex-fill">
                    <input type="text" class="add-item form-control" id="new-task" placeholder="New task..." />
                    <!-- <label class="form-label" for="new-task">New task...</label> -->
                </div>
                <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-info ms-2">Add</button>
            </form>
            <div class="item-status-wrap">
                <nav class="menu-status">
                    <ul class="items-status nav nav-tabs mb-4 pb-2">
                        <li class="nav-item item-status all">
                            <a class="nav-link active" id="ex1-tab-1" data-mdb-tab-init href="#ex1-tabs-1" role="tab"
                            aria-controls="ex1-tabs-1" aria-selected="true">All</a>
                        </li>
                        <li class="nav-item item-status active">
                            <a class="nav-link" id="ex1-tab-2" data-mdb-tab-init href="#ex1-tabs-2" role="tab"
                            aria-controls="ex1-tabs-2" aria-selected="false">Active</a>
                        </li>
                        <li class="nav-item item-status completed">
                            <a class="nav-link" id="ex1-tab-3" data-mdb-tab-init href="#ex1-tabs-3" role="tab"
                            aria-controls="ex1-tabs-3" aria-selected="false">Completed</a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="items-wrap tab-content" id="ex1-content">
                <div class="item-wrap tab-pane fade show active" id="ex1-tabs-1" role="tabpanel"
                aria-labelledby="ex1-tab-1">
                    <ul class="list-group mb-0">
                        <li class="list-item list-group-item d-flex align-items-center border-0 mb-2 rounded">
                            <input class="item-check form-check-input me-2" type="checkbox" value="" aria-label="..." checked />
                            <label class="item-text">Hometask 1</label>
                        </li>
                        <li class="list-item list-group-item d-flex align-items-center border-0 mb-2 rounded">
                            <input class="item-check form-check-input me-2" type="checkbox" value="" aria-label="..." checked />
                            <label class="item-text">Hometask 2</label>
                        <li class="list-item list-group-item d-flex align-items-center border-0 mb-2 rounded">
                            <input class="item-check form-check-input me-2" type="checkbox" value="" aria-label="..."  />
                            <label class="item-text">Hometask 3</label>
                        </li>
                    </ul>
                    
                </div>
                <div class="item-wrap tab-pane fade" id="ex1-tabs-2" role="tabpanel"
                aria-labelledby="ex1-tab-2">
                    <ul class="list-group mb-0">
                        <li class="list-item list-group-item d-flex align-items-center border-0 mb-2 rounded">
                            <input class="item-check form-check-input me-2" type="checkbox" value="" aria-label="..."  />
                            <label class="item-text">Hometask 3</label>
                        </li>
                    </ul>
                    
                </div>
                <div class="item-wrap tab-pane fade" id="ex1-tabs-3" role="tabpanel"
                aria-labelledby="ex1-tab-3">
                    <ul class="list-group mb-0">

                        <li class="list-item list-group-item d-flex align-items-center border-0 mb-2 rounded">
                            <input class="item-check form-check-input me-2" type="checkbox" value="" aria-label="..." checked />
                            <label class="item-text">Hometask 1</label>
                        </li>
                        <li class="list-item list-group-item d-flex align-items-center border-0 mb-2 rounded">
                            <input class="item-check form-check-input me-2" type="checkbox" value="" aria-label="..." checked />
                            <label class="item-text">Hometask 2</label>
                        <li class="list-item list-group-item d-flex align-items-center border-0 mb-2 rounded">
                            <input class="item-check form-check-input me-2" type="checkbox" value="" aria-label="..."  />
                            <label class="item-text">Hometask 3</label>
                        </li>
                    </ul>
                    
                </div>
                
            </div>
        </div>
    </main>
    <footer>
        <div class="footer">
            <p class="text-footer">
                Made by Aksana ©2024 with GFC
                <a href="https://github.com/ADziakon" target="_blank">My GitHub</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
